server:
  port: 8080

spring:
  application:
    name: marketing-agent
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
          temperature: 0.2

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent:
  mysql:
    url: jdbc:mysql://localhost:3306/marketing_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ""
  redis:
    host: localhost
    port: 6379
    key-prefix: marketing-agent
  milvus:
    host: localhost
    port: 19530
    collection: marketing_knowledge
  pgvector:
    url: jdbc:postgresql://localhost:5432/marketing_agent
    username: postgres
    password: ""
    table: marketing_knowledge_chunk
    top-k: 5
    embedding-dimensions: 384
  llm:
    default-provider: dashscope
    default-model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
    main-agent:
      prompt-version: main-agent-v1
      temperature: 0.2
      timeout-seconds: 60
