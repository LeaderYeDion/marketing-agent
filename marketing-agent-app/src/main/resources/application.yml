server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: marketing-agent
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:local-missing-gemini-api-key}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
            temperature: 0.2

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent:
  mysql:
    url: jdbc:mysql://localhost:3306/marketing_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ""
  redis:
    host: localhost
    port: 6379
    key-prefix: marketing-agent
  milvus:
    host: localhost
    port: 19530
    collection: marketing_knowledge
  pgvector:
    url: jdbc:postgresql://localhost:5432/marketing_agent
    username: postgres
    password: ""
    table: marketing_knowledge_chunk
    top-k: 5
    embedding-dimensions: 384
  llm:
    default-provider: gemini
    default-model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
    http-proxy:
      enabled: ${LLM_PROXY_ENABLED:false}
      host: ${LLM_PROXY_HOST:}
      port: ${LLM_PROXY_PORT:0}
    gemini:
      api-key: ${GEMINI_API_KEY:local-missing-gemini-api-key}
      model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    main-agent:
      prompt-version: main-agent-v1
      temperature: 0.2
      timeout-seconds: 60
